<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var nativeFetch = window.fetch;
          var fetchVal = nativeFetch ? nativeFetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return fetchVal;
            },
            set: function(fn) {
              fetchVal = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            Object.defineProperty(Window.prototype, 'fetch', {
              get: function() {
                return fetchVal;
              },
              set: function(fn) {
                fetchVal = fn;
              },
              configurable: true,
              enumerable: true
            });
          } catch (err) {}
        }

        // Suppress expected benign [vite] websocket disconnection messages in container/iframe sandbox
        var originalWarn = console.warn;
        console.warn = function() {
          var firstArg = arguments[0];
          if (typeof firstArg === 'string' && (firstArg.indexOf('[vite]') !== -1 || firstArg.indexOf('websocket') !== -1)) {
            return;
          }
          return originalWarn.apply(console, arguments);
        };

        var originalError = console.error;
        console.error = function() {
          var firstArg = arguments[0];
          if (typeof firstArg === 'string' && (firstArg.indexOf('[vite]') !== -1 || firstArg.indexOf('websocket') !== -1)) {
            return;
          }
          return originalError.apply(console, arguments);
        };

        window.addEventListener('error', function(event) {
          if (
            event &&
            event.message &&
            (event.message.indexOf('fetch of #<Window> which has only a getter') !== -1 ||
             event.message.indexOf('[vite]') !== -1 ||
             event.message.indexOf('WebSocket') !== -1)
          ) {
            event.preventDefault();
            return true;
          }
        });
      })();
    </script>
    <title>Sejda - PDF Tasks & AI Tools</title>
    <meta name="description" content="Sejda helps with your PDF tasks. Cross-platform desktop software for Windows, macOS, Linux, and web. Edit, merge, split, compress, fill & sign PDFs offline and with AI document intelligence." />
    <meta property="og:title" content="Sejda - PDF Tasks & AI Tools" />
    <meta property="og:description" content="Sejda helps with your PDF tasks. Cross-platform desktop software for Windows, macOS, Linux, and web. Edit, merge, split, compress, fill & sign PDFs offline and with AI document intelligence." />
