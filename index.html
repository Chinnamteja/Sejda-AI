    <script>
      (function() {
        try {
          var nativeFetch = window.fetch;
          var fetchVal = nativeFetch ? nativeFetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return fetchVal;
            },
            set: function(fn) {
              fetchVal = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            Object.defineProperty(Window.prototype, 'fetch', {
              get: function() {

        // Suppress expected benign [vite] and cross-origin iframe warning messages

            firstArg.indexOf('websocket') !== -1 ||

        var originalError = console.error;

            firstArg.indexOf('cross-origin frame') !== -1

        };

        window.addEventListener('error', function(event) {
          if (
            event &&
            event.message &&
            (event.message.indexOf('fetch of #<Window> which has only a getter') !== -1 ||
             event.message.indexOf('[vite]') !== -1 ||
             event.message.indexOf('WebSocket') !== -1 ||

             event.message.indexOf('Page-level tag does not work inside iframes') !== -1 ||
             event.message.indexOf('cross-origin frame') !== -1)
          ) {
            event.preventDefault();
            return true;
          }
        }, true);
      })();
